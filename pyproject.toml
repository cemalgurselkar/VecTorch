[project]
name = "vectorch"
version = "0.1.0"
description = "An embedded, persistent vector database for Python"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Cemal Gürsel", email = "cemalgurselkar@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26.4",
]
keywords = [
    "database",
    "embeddings",
    "vector-database",
    "vector-search",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Database",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://github.com/cemalgurselkar/VecTorch"
Documentation = "https://github.com/cemalgurselkar/VecTorch#readme"
Issues = "https://github.com/cemalgurselkar/VecTorch/issues"
Repository = "https://github.com/cemalgurselkar/VecTorch.git"

[build-system]
requires = ["uv_build>=0.12.16,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-benchmark>=5.3.0",
    "ruff>=0.16.9",
]

[tool.pytest.ini_options]
pythonpath = ["."]
