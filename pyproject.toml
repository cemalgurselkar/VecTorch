[project]
name = "vectorch"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Cemal Gürsel", email = "cemalgurselkar@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "numba>=0.68.0",
    "numpy>=2.4.6",
]

[project.scripts]
vectorch = "vectorch:main"

[build-system]
requires = ["uv_build>=0.12.16,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-benchmark>=5.3.0",
    "ruff>=0.16.9",
]
